<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd3ea"/>
      <stop offset=".55" stop-color="#e9dbe0"/>
      <stop offset="1" stop-color="#f7dccc"/>
    </linearGradient>
    <linearGradient id="seine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb1c9"/>
      <stop offset="1" stop-color="#6d93b0"/>
    </linearGradient>
    <linearGradient id="stoneL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9dcc5"/>
      <stop offset="1" stop-color="#f4ead8"/>
    </linearGradient>
    <linearGradient id="stoneR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8c7ab"/>
      <stop offset="1" stop-color="#ead9bf"/>
    </linearGradient>
    <linearGradient id="zinc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8794a8"/>
      <stop offset="1" stop-color="#66738a"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset=".45" stop-color="#ffe6b8" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ffe6b8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lattice" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0 V4" stroke="#8a6f55" stroke-width=".6"/>
    </pattern>
  </defs>

  <!-- sky, low sun, clouds, birds -->
  <rect width="400" height="210" fill="url(#sky)"/>
  <circle cx="300" cy="96" r="46" fill="url(#sun)"/>
  <circle cx="300" cy="96" r="11" fill="#fff4d6"/>
  <g fill="#fff" opacity=".75">
    <ellipse cx="70" cy="34" rx="34" ry="7"/><ellipse cx="96" cy="30" rx="20" ry="6"/>
    <ellipse cx="250" cy="22" rx="28" ry="5"/><ellipse cx="350" cy="44" rx="22" ry="4"/>
  </g>
  <g stroke="#6b6f80" stroke-width="1" fill="none" stroke-linecap="round">
    <path d="M150 40 q3 -3 6 0 q3 -3 6 0"/><path d="M168 48 q2 -2 4 0 q2 -2 4 0"/><path d="M140 52 q2 -2 4 0 q2 -2 4 0"/>
  </g>

  <!-- far city: hazy rooftops and Sacré-Coeur on Montmartre -->
  <g fill="#d6c9d6" opacity=".9">
    <path d="M0 130 h20 v-8 h14 v6 h18 v-10 h10 v10 h22 v-6 h16 v8 h20 v-4 h24 v10 H0z"/>
    <path d="M250 130 v-10 h18 v6 h20 v-12 h14 v12 h22 v-6 h30 v4 h46 v6z"/>
  </g>
  <g fill="#e6dce4">
    <path d="M34 120 q8 -10 26 -12 q18 2 26 12z"/>
    <path d="M52 108 q8 -14 16 0z"/><rect x="58" y="96" width="4" height="8"/><path d="M57 96 l3 -5 l3 5z"/>
    <path d="M42 112 q4 -6 8 0z"/><path d="M70 112 q4 -6 8 0z"/>
  </g>

  <!-- the Seine and a stone bridge -->
  <rect y="146" width="400" height="22" fill="url(#seine)"/>
  <g stroke="#fff" stroke-opacity=".5" stroke-width="1" stroke-linecap="round">
    <path d="M30 154 h18"/><path d="M90 160 h26"/><path d="M200 156 h14"/><path d="M262 162 h20"/><path d="M330 152 h16"/>
  </g>
  <rect x="300" y="88" width="3" height="58" fill="#f6e4b8" opacity=".35"/>
  <path d="M96 146 h196 v-6 H96z" fill="#cdbb9c"/>
  <path d="M96 146 v8 q20 -14 40 0 q20 -14 40 0 q20 -14 40 0 q20 -14 40 0 q18 -12 36 0 v-8z" fill="#d9c8a8"/>
  <g fill="#6d93b0"><path d="M100 154 q16 -10 32 0z"/><path d="M140 154 q16 -10 32 0z"/><path d="M180 154 q16 -10 32 0z"/><path d="M220 154 q16 -10 32 0z"/><path d="M260 154 q14 -9 28 0z"/></g>
  <g fill="#3d4352"><rect x="118" y="132" width="1.5" height="8"/><rect x="178" y="132" width="1.5" height="8"/><rect x="238" y="132" width="1.5" height="8"/></g>
  <g fill="#ffe7a6"><circle cx="118.7" cy="131" r="2"/><circle cx="178.7" cy="131" r="2"/><circle cx="238.7" cy="131" r="2"/></g>

  <!-- Eiffel Tower -->
  <g transform="translate(200 0)">
    <!-- legs and arch -->
    <path d="M-34 140 L-14 86 L-8 86 L-20 140 Z" fill="#6b5440"/>
    <path d="M34 140 L14 86 L8 86 L20 140 Z" fill="#5a4635"/>
    <path d="M-34 140 L-14 86 L-8 86 L-20 140 Z" fill="url(#lattice)" opacity=".7"/>
    <path d="M34 140 L14 86 L8 86 L20 140 Z" fill="url(#lattice)" opacity=".6"/>
    <path d="M-20 140 Q0 104 20 140" fill="none" stroke="#6b5440" stroke-width="3"/>
    <!-- first platform -->
    <rect x="-19" y="84" width="38" height="5" fill="#5a4635"/>
    <path d="M-19 84 h38" stroke="#8a6f55" stroke-width="1"/>
    <g fill="#ffe2a0" opacity=".9"><rect x="-15" y="85.5" width="2" height="2"/><rect x="-9" y="85.5" width="2" height="2"/><rect x="-3" y="85.5" width="2" height="2"/><rect x="3" y="85.5" width="2" height="2"/><rect x="9" y="85.5" width="2" height="2"/></g>
    <!-- middle section -->
    <path d="M-13 84 L-6 50 L6 50 L13 84 Z" fill="#6b5440"/>
    <path d="M-13 84 L-6 50 L6 50 L13 84 Z" fill="url(#lattice)" opacity=".7"/>
    <path d="M-6 84 Q0 70 6 84" fill="none" stroke="#5a4635" stroke-width="1.5"/>
    <!-- second platform -->
    <rect x="-8" y="48" width="16" height="3.5" fill="#5a4635"/>
    <!-- top section -->
    <path d="M-5 48 L-1.6 14 L1.6 14 L5 48 Z" fill="#6b5440"/>
    <path d="M-5 48 L-1.6 14 L1.6 14 L5 48 Z" fill="url(#lattice)" opacity=".6"/>
    <rect x="-3.2" y="12" width="6.4" height="3" fill="#5a4635"/>
    <rect x="-1" y="2" width="2" height="10" fill="#5a4635"/>
    <path d="M0 0 v3" stroke="#5a4635" stroke-width=".8"/>
  </g>

  <!-- trees along the quay -->
  <g>
    <ellipse cx="118" cy="128" rx="14" ry="11" fill="#7a9a5a"/><ellipse cx="112" cy="124" rx="8" ry="6" fill="#8fb06a"/>
    <ellipse cx="282" cy="128" rx="14" ry="11" fill="#6f8f50"/><ellipse cx="288" cy="124" rx="8" ry="6" fill="#88a865"/>
  </g>

  <!-- quay: stone wall along the river, then the pavement -->
  <rect y="166" width="400" height="5" fill="#cdbb9c"/>
  <rect y="171" width="400" height="29" fill="#d9cfc2"/>
  <g stroke="#c8bdaf" stroke-width=".6"><path d="M0 182 h400 M0 192 h400"/></g>
  <!-- LEFT: Haussmann building, sunlit -->
  <g>
    <rect x="0" y="62" width="92" height="148" fill="url(#stoneL)"/>
    <!-- mansard roof with dormers and chimneys -->
    <path d="M-4 62 L6 38 H86 L96 62 Z" fill="url(#zinc)"/>
    <g fill="#f2e7d4"><rect x="16" y="44" width="10" height="14" rx="5"/><rect x="40" y="44" width="10" height="14" rx="5"/><rect x="64" y="44" width="10" height="14" rx="5"/></g>
    <g fill="#5f6b80"><rect x="18" y="48" width="6" height="9" rx="3"/><rect x="42" y="48" width="6" height="9" rx="3"/><rect x="66" y="48" width="6" height="9" rx="3"/></g>
    <g fill="#c26b4a"><rect x="12" y="28" width="8" height="10"/><rect x="58" y="26" width="10" height="12"/></g>
    <g fill="#a85a3d"><rect x="13" y="26" width="2" height="3"/><rect x="16" y="26" width="2" height="3"/><rect x="60" y="24" width="2" height="3"/><rect x="64" y="24" width="2" height="3"/></g>
    <!-- cornice lines -->
    <g fill="#d9c9ae"><rect x="0" y="62" width="92" height="3"/><rect x="0" y="96" width="92" height="2"/><rect x="0" y="128" width="92" height="2"/><rect x="0" y="160" width="92" height="3"/></g>
    <!-- windows: three floors -->
    <g fill="#7f8ea4">
      <rect x="10" y="70" width="12" height="20"/><rect x="34" y="70" width="12" height="20"/><rect x="58" y="70" width="12" height="20"/><rect x="80" y="70" width="10" height="20"/>
      <rect x="10" y="102" width="12" height="20"/><rect x="34" y="102" width="12" height="20"/><rect x="58" y="102" width="12" height="20"/><rect x="80" y="102" width="10" height="20"/>
      <rect x="10" y="134" width="12" height="20"/><rect x="34" y="134" width="12" height="20"/><rect x="58" y="134" width="12" height="20"/><rect x="80" y="134" width="10" height="20"/>
    </g>
    <!-- warm lit windows and reflections -->
    <g fill="#ffd98a" opacity=".85"><rect x="34" y="102" width="12" height="20"/><rect x="80" y="134" width="10" height="20"/></g>
    <g fill="#fff" opacity=".35"><path d="M10 70 l6 0 l-6 8z"/><path d="M58 70 l6 0 l-6 8z"/><path d="M10 134 l6 0 l-6 8z"/></g>
    <!-- window crosses -->
    <g stroke="#efe3cf" stroke-width="1"><path d="M16 70 v20 M40 70 v20 M64 70 v20 M85 70 v20 M16 102 v20 M40 102 v20 M64 102 v20 M85 102 v20 M16 134 v20 M40 134 v20 M64 134 v20 M85 134 v20"/></g>
    <!-- wrought-iron balconies -->
    <g stroke="#2e3340" stroke-width="1" fill="none">
      <path d="M4 90 h88"/><path d="M4 95 h88"/>
      <path d="M8 90 v5 M12 90 v5 M16 90 v5 M20 90 v5 M24 90 v5 M28 90 v5 M32 90 v5 M36 90 v5 M40 90 v5 M44 90 v5 M48 90 v5 M52 90 v5 M56 90 v5 M60 90 v5 M64 90 v5 M68 90 v5 M72 90 v5 M76 90 v5 M80 90 v5 M84 90 v5 M88 90 v5"/>
      <path d="M8 154 h16 M32 154 h16 M56 154 h16"/><path d="M8 158 h16 M32 158 h16 M56 158 h16"/>
    </g>
    <g fill="#d9534f"><circle cx="12" cy="88" r="1.6"/><circle cx="16" cy="87.5" r="1.6"/><circle cx="20" cy="88" r="1.6"/><circle cx="60" cy="88" r="1.6"/><circle cx="64" cy="87.5" r="1.6"/></g>
    <g fill="#5c8a4a"><rect x="10" y="88.5" width="12" height="1.6"/><rect x="58" y="88.5" width="8" height="1.6"/></g>
    <!-- café on the ground floor -->
    <rect x="0" y="163" width="92" height="47" fill="#2f3a4f"/>
    <rect x="22" y="156" width="48" height="9" rx="1.5" fill="#2f3a4f"/>
    <text x="46" y="163" font-family="Georgia,serif" font-size="7" font-style="italic" fill="#f3e3b5" text-anchor="middle">Café</text>
    <path d="M-2 166 h96 l-6 12 H4 Z" fill="#b8322f"/>
    <g fill="#f6efe2"><path d="M8 178 l4 -12 h6 l-4 12z"/><path d="M26 178 l4 -12 h6 l-4 12z"/><path d="M44 178 l4 -12 h6 l-4 12z"/><path d="M62 178 l4 -12 h6 l-4 12z"/><path d="M80 178 l4 -12 h6 l-4 12z"/></g>
    <rect x="6" y="182" width="80" height="18" fill="#f3c87a" opacity=".85"/>
    <g stroke="#2f3a4f" stroke-width="1.2"><path d="M26 182 v18 M46 182 v18 M66 182 v18"/></g>

  </g>

  <!-- RIGHT: Haussmann corner building, shade side -->
  <g>
    <rect x="318" y="70" width="82" height="140" fill="url(#stoneR)"/>
    <path d="M312 70 L322 48 H404 V70 Z" fill="url(#zinc)"/>
    <g fill="#e7d7bd"><rect x="334" y="52" width="10" height="14" rx="5"/><rect x="358" y="52" width="10" height="14" rx="5"/><rect x="382" y="52" width="10" height="14" rx="5"/></g>
    <g fill="#5f6b80"><rect x="336" y="56" width="6" height="9" rx="3"/><rect x="360" y="56" width="6" height="9" rx="3"/><rect x="384" y="56" width="6" height="9" rx="3"/></g>
    <rect x="370" y="36" width="10" height="12" fill="#b9644a"/>
    <g fill="#ccb998"><rect x="318" y="70" width="82" height="3"/><rect x="318" y="104" width="82" height="2"/><rect x="318" y="136" width="82" height="2"/><rect x="318" y="166" width="82" height="3"/></g>
    <g fill="#7a879c">
      <rect x="326" y="78" width="12" height="20"/><rect x="350" y="78" width="12" height="20"/><rect x="374" y="78" width="12" height="20"/>
      <rect x="326" y="110" width="12" height="20"/><rect x="350" y="110" width="12" height="20"/><rect x="374" y="110" width="12" height="20"/>
      <rect x="326" y="142" width="12" height="20"/><rect x="350" y="142" width="12" height="20"/><rect x="374" y="142" width="12" height="20"/>
    </g>
    <g fill="#ffd98a" opacity=".8"><rect x="350" y="142" width="12" height="20"/></g>
    <g stroke="#e3d3b8" stroke-width="1"><path d="M332 78 v20 M356 78 v20 M380 78 v20 M332 110 v20 M356 110 v20 M380 110 v20 M332 142 v20 M356 142 v20 M380 142 v20"/></g>
    <g stroke="#2e3340" stroke-width="1" fill="none">
      <path d="M320 98 h80"/><path d="M320 103 h80"/>
      <path d="M324 98 v5 M328 98 v5 M332 98 v5 M336 98 v5 M340 98 v5 M344 98 v5 M348 98 v5 M352 98 v5 M356 98 v5 M360 98 v5 M364 98 v5 M368 98 v5 M372 98 v5 M376 98 v5 M380 98 v5 M384 98 v5 M388 98 v5 M392 98 v5 M396 98 v5"/>
    </g>
    <!-- boulangerie -->
    <rect x="318" y="169" width="82" height="41" fill="#3a5a4a"/>
    <rect x="324" y="176" width="70" height="8" fill="#2c4638"/>
    <text x="359" y="182.2" font-family="Georgia,serif" font-size="5.6" fill="#f3e3b5" text-anchor="middle" letter-spacing=".6">BOULANGERIE</text>
    <rect x="326" y="188" width="66" height="14" fill="#f5d38f" opacity=".9"/>
    <g fill="#c98a3e"><ellipse cx="338" cy="198" rx="7" ry="2"/><ellipse cx="356" cy="197" rx="6" ry="2.5"/><path d="M366 199 q6 -6 14 0 q-7 3 -14 0z"/></g>
  </g>

  <!-- street, Morris column, lamp, bistro tables -->
  <rect y="200" width="400" height="10" fill="#9a8f84"/>
  <g stroke="#837870" stroke-width=".6"><path d="M0 204 h400"/><path d="M20 200 v10 M60 200 v10 M100 200 v10 M140 200 v10 M180 200 v10 M220 200 v10 M260 200 v10 M300 200 v10 M340 200 v10 M380 200 v10"/></g>
  <g>
    <rect x="292" y="170" width="14" height="30" rx="2" fill="#2f5b46"/>
    <path d="M290 170 q9 -10 18 0z" fill="#2f5b46"/><circle cx="299" cy="160" r="1.8" fill="#2f5b46"/>
    <rect x="294" y="176" width="10" height="16" fill="#f1e2c4"/>
    <g fill="#b8322f"><rect x="295" y="178" width="8" height="3"/></g><g fill="#3d6a9e"><rect x="295" y="183" width="8" height="2"/><rect x="295" y="187" width="6" height="2"/></g>
  </g>
  <g>
    <rect x="104" y="150" width="2" height="50" fill="#2b2f38"/>
    <path d="M100 150 h10 l-2 -7 h-6z" fill="#2b2f38"/><rect x="102" y="144" width="6" height="5" fill="#ffe7a6"/>
    <circle cx="105" cy="146.5" r="9" fill="#ffe7a6" opacity=".25"/>
  </g>
  <g fill="#2b2f38">
    <ellipse cx="124" cy="190" rx="6" ry="1.5"/><rect x="123.3" y="190" width="1.4" height="10"/>
    <path d="M114 200 v-8 h4 v-4 h1 v12z"/><path d="M134 200 v-8 h-4 v-4 h-1 v12z"/>
    <ellipse cx="150" cy="190" rx="6" ry="1.5"/><rect x="149.3" y="190" width="1.4" height="10"/>
    <path d="M160 200 v-8 h-4 v-4 h-1 v12z"/>
  </g>
  <g fill="#fff"><rect x="121" y="186" width="2" height="3" rx=".5"/><rect x="152" y="186" width="2" height="3" rx=".5"/></g>
</svg>
